name: conductor-dev
services:

  netbox:
    image: linuxserver/netbox:4.3.7
    container_name: conductor-netbox-dev
    restart: unless-stopped
    environment:
      ALLOWED_HOST: '*'
      SUPERUSER_EMAIL: admin@conductor.dev
      SUPERUSER_PASSWORD: conductor-dev
      DB_USER: conductor-dev
      DB_PASSWORD: conductor-dev
      DB_NAME: conductor-dev
      REDIS_PASSWORD: conductor-dev
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/conductor-dev/conductor-netbox-dev:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17.7
    container_name: conductor-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: conductor-dev
      POSTGRES_PASSWORD: conductor-dev
      POSTGRES_DB: conductor-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor-dev -d conductor-dev" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./volumes/conductor-dev/conductor-postgres-dev:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2
    container_name: conductor-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass conductor-dev
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a conductor-dev ping" ]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./volumes/conductor-dev/conductor-redis-dev:/data